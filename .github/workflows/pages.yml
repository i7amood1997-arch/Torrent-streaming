name: Deploy site to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Configure Pages
        id: pages
        # Fails with "Get Pages site failed" until Settings → Pages → Source is set to "GitHub Actions".
        if: github.ref_name == github.event.repository.default_branch
        uses: actions/configure-pages@v5
      - name: Build static export
        run: npm run build
        env:
          # e.g. "/Torrent-streaming" for https://<user>.github.io/Torrent-streaming/
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Repository variable (Settings → Secrets and variables → Actions → Variables)
          NEXT_PUBLIC_API_BASE: ${{ vars.API_BASE_URL }}
      # Android TV app (android-tv/): a WebView shell around this site, published as /tv.apk.
      # If it fails to build, the website still deploys.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build Android TV app
        id: tvapp
        continue-on-error: true
        working-directory: android-tv
        env:
          TV_APP_URL: ${{ steps.pages.outputs.base_url && format('{0}/', steps.pages.outputs.base_url) || '' }}
        run: |
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../out/tv.apk
      - uses: actions/upload-artifact@v4
        if: steps.tvapp.outcome == 'success'
        with:
          name: streamdeck-tv-apk
          path: out/tv.apk
      - uses: actions/upload-pages-artifact@v3
        if: github.ref_name == github.event.repository.default_branch
        with:
          path: out

  deploy:
    needs: build
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
