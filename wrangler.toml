# Cloudflare Worker hosting the API for the GitHub Pages frontend.
# Deploy:  npx wrangler login && npx wrangler deploy
# Secrets (all optional — users can also enter their own keys in the app):
#   npx wrangler secret put TMDB_API_KEY
#   npx wrangler secret put REALDEBRID_API_KEY | TORBOX_API_KEY | DEBRIDLINK_API_KEY
#   npx wrangler secret put OPENSUBTITLES_API_KEY | SUBDL_API_KEY
#   npx wrangler secret put TORZNAB_URL | TORZNAB_API_KEY
#   npx wrangler secret put ACCESS_TOKEN   # strongly recommended if you store Debrid keys here
#   npx wrangler secret put ANTHROPIC_API_KEY   # optional: Claude translates subtitles only when every other translator refused
#   npx wrangler secret put GROQ_API_KEY   # optional: speech recognition once the free Workers AI allowance is used up
name = "streamdeck-api"
main = "worker/index.ts"
compatibility_date = "2025-09-01"
# Serve on https://<name>.<account>.workers.dev (the URL you paste into the app Settings)
workers_dev = true

# Built-in torrent streaming: one Durable Object per torrent (free plan: SQLite-backed classes).
[[durable_objects.bindings]]
name = "STREAM"
class_name = "TorrentStream"

# Workers AI (free daily allowance): speech recognition for titles without subtitles.
[ai]
binding = "AI"

[[durable_objects.bindings]]
# Small per-user storage: TV pairing codes and the state your devices sync (worker/user-do.ts).
name = "USERDATA"
class_name = "UserData"

# New-episode alerts: checked every 6 hours (worker/index.ts scheduled).
[triggers]
crons = ["23 */6 * * *"]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TorrentStream"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["UserData"]

[vars]
INDEXERS = "torrentio,torznab,yts,eztv,apibay,knaben,torrentscsv,nyaa,animetosho,mediafusion,addons,archive,torrentsdb,bitsearch,torrentclaw,torrentdownload,torrentgalaxy,therarbg,kickass"
TORRENTIO_URL = "https://torrentio.strem.fun"
# Comma-separated; known mirrors are tried automatically after these.
YTS_URL = "https://yts.gg"
EZTV_URL = "https://eztvx.to"
APIBAY_URL = "https://apibay.org"
OPENSUBTITLES_USER_AGENT = "StreamdeckPWA v0.1"
# Comma-separated origins allowed to call this API, e.g. "https://<user>.github.io".
# Use "*" to allow any site (keys sent by the browser are still the user's own).
ALLOWED_ORIGINS = "https://i7amood1997-arch.github.io,http://localhost:3000"
ALLOW_CLIENT_TORZNAB = "false"
